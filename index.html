<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My E-Paper Frame</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 500px;
      margin: 40px auto;
      padding: 20px;
      background: #f3f3f3;
      color: #222;
    }
.card {
  background: white;
  padding: 24px;
  border-radius: 16px;
  box-shadow: 0 3px 12px #0001;
}
h1 {
  font-size: 25px;
  margin-top: 0;
}
textarea {
  box-sizing: border-box;
  width: 100%;
  min-height: 140px;
  padding: 12px;
  font: inherit;
  font-size: 16px;
  border: 1px solid #bbb;
  border-radius: 8px;
  resize: vertical;
}
button {
  width: 100%;
  margin-top: 14px;
  padding: 14px;
  border: 0;
  border-radius: 8px;
  background: #222;
  color: white;
  font-size: 16px;
  cursor: pointer;
}
#status {
  margin-top: 14px;
  overflow-wrap: anywhere;
}
.hint {
  color: #666;
  font-size: 14px;
}
  </style>
</head>
<body>
  <div class="card">
    <h1>My E-Paper Frame</h1>
    <p>Write a message to display on your frame.</p>
<form id="messageForm">
  <label for="message">Your message</label>
  <textarea id="message" maxlength="500"
    placeholder="Type your message here..." required></textarea>
  <button type="submit">Send to Frame</button>
</form>
<p class="hint">Your frame must be powered on and connected to Wi-Fi.</p>
<p id="status" role="status" aria-live="polite"></p>
  </div>
  <script>
    const form = document.getElementById("messageForm");
    const messageBox = document.getElementById("message");
    const statusBox = document.getElementById("status");
    form.addEventListener("submit", async function (event) {
      event.preventDefault();
      const message = messageBox.value.trim();
      if (!message) {
        statusBox.textContent = "Please enter a message.";
        return;
      }
      statusBox.textContent =
        "The sending service hasn't been connected yet. We'll set that up next.";
    });
  </script>
</body>
</html>
