<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My E-Paper Frame</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 500px;
      margin: 40px auto;
      padding: 20px;
      background: #f3f3f3;
      color: #222;
    }
    .card {
      background: white;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 3px 12px #0001;
    }
    h1 { font-size: 25px; margin-top: 0; }
    label { display: block; margin: 16px 0 8px; }
    textarea, input {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      font: inherit;
      font-size: 16px;
      border: 1px solid #bbb;
      border-radius: 8px;
    }
    textarea { min-height: 130px; resize: vertical; }
    button {
      width: 100%;
      margin-top: 18px;
      padding: 14px;
      border: 0;
      border-radius: 8px;
      background: #222;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
    #status { margin-top: 16px; overflow-wrap: anywhere; }
    .hint { color: #666; font-size: 14px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>My E-Paper Frame</h1>
    <p>Send a message to your display from anywhere.</p>
<form id="messageForm">
  <label for="token">Private access token</label>
  <input id="token" type="password" autocomplete="off"
    placeholder="Enter your PHONE_TOKEN" required>
  <label for="message">Your message</label>
  <textarea id="message" maxlength="500"
    placeholder="Type your message here..." required></textarea>
  <button id="sendButton" type="submit">Send to Frame</button>
</form>
<p class="hint">Your frame must be powered on and connected to Wi-Fi.</p>
<p id="status" role="status" aria-live="polite"></p>
  </div>
  <script>
    const form = document.getElementById("messageForm");
    const statusBox = document.getElementById("status");
    const sendButton = document.getElementById("sendButton");
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const token = document.getElementById("token").value;
      const message = document.getElementById("message").value.trim();
      if (!message) {
        statusBox.textContent = "Please enter a message.";
        return;
      }
      sendButton.disabled = true;
      statusBox.textContent = "Sending message...";
      try {
        const response = await fetch(
          "https://epaper-message-sender.dylanjlaptop.workers.dev/",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "Authorization": "Bearer " + token
            },
            body: JSON.stringify({ message })
          }
        );
        const result = await response.json();
        if (!response.ok) {
          throw new Error(result.error || "The message could not be sent.");
        }
        statusBox.textContent = "Message sent successfully!";
      } catch (error) {
        statusBox.textContent =
          error.message === "Failed to fetch"
            ? "Could not reach the sending service. Check your connection and try again."
            : error.message;
      } finally {
        sendButton.disabled = false;
      }
    });
  </script>
</body>
</html>
